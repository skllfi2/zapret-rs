name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint, Typecheck and Test
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: python -m ruff check .

      - name: Run Mypy Typecheck
        run: python -m mypy

      - name: Run Unit Tests with Coverage
        run: |
          python -W error::ResourceWarning -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=90

  build:
    name: Build Executable Artifact
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Executable
        run: python build_exe.py

      - name: Upload zapret-simple.exe
        uses: actions/upload-artifact@v4
        with:
          name: zapret-simple-windows
          path: dist/zapret-simple.exe
          if-no-files-found: error
