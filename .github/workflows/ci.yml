name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  rust-check-build:
    name: Rust Check & Build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "zapret-slint -> zapret-slint/target"

      - name: Cargo Check
        run: cargo check --manifest-path zapret-slint/Cargo.toml

      - name: Cargo Build Release
        run: cargo build --release --manifest-path zapret-slint/Cargo.toml

      - name: Upload zapret-rs Binary
        uses: actions/upload-artifact@v4
        with:
          name: zapret-rs-windows-x64
          path: zapret-slint/target/release/zapret-rs.exe
          if-no-files-found: error
