name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build zapret-rs and Create Release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Rust & build zapret-rs release binary
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build zapret-rs Executable
        run: cargo build --release --manifest-path zapret-slint/Cargo.toml

      # Stage release artifacts & generate SHA-256 checksums
      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-dist
          Copy-Item zapret-slint\target\release\zapret-rs.exe -Destination release-dist\zapret-rs.exe
          
          # Generate SHA256
          Get-FileHash release-dist\*.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)"
          } | Out-File -FilePath release-dist\sha256sums.txt -Encoding ascii

      # Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/zapret-rs.exe
            release-dist/sha256sums.txt
          generate_release_notes: true
