# ruff.toml — линт zapret-simple
# Покрытие: pyflakes (F), bugbear (B — реальные баги), isort (I), синтаксис/стиль (E4/E7/E9).
# Осознанно НЕ включены:
#   BLE001/S110  — широкие except Exception и pass на границах (UI/логика «не падать никогда»)
#   PLW1510      — subprocess.run без check: returncode проверяется вручную
#   SIM115/E501  — сознательные однострочники open() и длинные строки вывода
line-length = 110
target-version = "py315"

[lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[lint.per-file-ignores]
# Фасад: реэкспорт публичного API ядра + точка патчинга для тестов
# (mock.patch("service_manager.subprocess.run") резолвится в атрибуты этого модуля)
"service_manager.py" = ["F401", "I001"]

[lint.isort]
known-first-party = ["zapret_core", "service_manager", "i18n", "zapret_pyside"]
