# mypy — статическая проверка типов zapret-simple (запуск: python -m mypy)
# Проверяется всё: ядро zapret_core, фасад service_manager, локализация и UI.
# win32/PySide6-импорты без стабов не роняют проверку (ignore_missing_imports).
[mypy]
python_version = 3.15
files = zapret_core, service_manager.py, i18n.py, zapret_pyside.py
ignore_missing_imports = True
# Тела нетипизированных функций тоже проверяются — ловим опечатки и сомнительные
# выражения даже там, где сигнатура пока не описана явно.
check_untyped_defs = True
show_error_codes = True
