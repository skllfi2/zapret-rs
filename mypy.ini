# mypy configuration for zapret-simple (python -m mypy)
# Covers zapret_core, service_manager, i18n, zapret_pyside, smoke_live
[mypy]
python_version = 3.12
files = zapret_core, service_manager.py, i18n.py, zapret_pyside.py, smoke_live.py
ignore_missing_imports = True
check_untyped_defs = True
show_error_codes = True
